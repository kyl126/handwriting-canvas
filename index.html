<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>全屏手写 · 像素画布</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }

  :root {
    --bg:#0f0f14; --panel:#14141a; --panel2:#1e1e28; --border:#222;
    --text:#ddd; --muted:#666; --muted2:#888;
    --btn-bg:#1a1a22; --btn-border:#333; --btn-hover-border:#666; --btn-hover-bg:#22222c;
    --canvas-bg:#0f0f14; --accent:#6ee7ff; --accent-text:#0f0f14;
  }
  body.theme-light {
    --bg:#f3f3f7; --panel:#ffffff; --panel2:#f0f0f5; --border:#d8d8e0;
    --text:#1c1c24; --muted:#777; --muted2:#999;
    --btn-bg:#ffffff; --btn-border:#d0d0da; --btn-hover-border:#999; --btn-hover-bg:#ececf3;
    --canvas-bg:#ffffff; --accent:#0ea5c4; --accent-text:#ffffff;
  }

  body {
    background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    display:flex; flex-direction:column; align-items:center;
    gap:14px; padding:16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    overflow-x:hidden; min-height:100vh;
    transition: background .2s, color .2s;
  }
  h1 { font-size:15px; font-weight:400; color:var(--muted); letter-spacing:2px; }

  #display {
    width:100%; max-width:900px; min-height:120px;
    border:1px solid var(--border); border-radius:12px; background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative; cursor:pointer;
  }
  #display img { display:block; width:100%; height:auto; max-height:220px; object-fit:contain; }
  #emptyTip { color:var(--muted); font-size:14px; }
  #display.hasContent #emptyTip { display:none; }

  #display.scroll { justify-content:flex-start; align-items:center; flex-direction:column; overflow:hidden; }
  #display.scroll .track {
    display:flex; flex-direction:column; align-items:center; width:100%;
    animation: marqueeY var(--speed,8s) linear infinite;
    will-change:transform; transform: translateY(-50%);
  }
  #display.scroll .track img { width:90%; max-width:900px; height:auto; margin-bottom:60px; flex:0 0 auto; object-fit:contain; }
  @keyframes marqueeY { from{transform:translateY(-50%)} to{transform:translateY(0)} }

  @media (min-width:760px) and (orientation:landscape) {
    #display.scroll { justify-content:flex-start; align-items:center; flex-direction:row; }
    #display.scroll .track { flex-direction:row; align-items:center; width:auto; height:160px; animation: marqueeX var(--speed,8s) linear infinite; transform: translateX(0); }
    #display.scroll .track img { height:120px; width:auto; margin-bottom:0; margin-right:80px; flex:0 0 auto; }
    @keyframes marqueeX { from{transform:translateX(0)} to{transform:translateX(-100%)} }
  }

  body.scroll-mode { padding:0; gap:0; overflow:hidden; }
  body.scroll-mode h1, body.scroll-mode .controls, body.scroll-mode #displayBar { display:none !important; }
  body.scroll-mode #display {
    width:100vw; max-width:none; height:100vh; height:100dvh;
    min-height:0; border:none; border-radius:0; background:var(--canvas-bg);
    justify-content:flex-start; align-items:center; flex-direction:column;
  }
  body.scroll-mode #display.scroll .track { flex-direction:column; align-items:center; width:100%; height:auto; animation: marqueeY var(--speed,8s) linear infinite; transform: translateY(-50%); }
  body.scroll-mode #display.scroll .track img { width:80vw; max-width:1200px; height:auto; margin-bottom:8vh; flex:0 0 auto; object-fit:contain; }

  @media (min-width:760px) and (orientation:landscape) {
    body.scroll-mode #display { justify-content:flex-start; align-items:center; flex-direction:row; }
    body.scroll-mode #display.scroll .track { flex-direction:row; align-items:center; width:auto; height:100vh; height:100dvh; animation: marqueeX var(--speed,8s) linear infinite; transform: translateX(0); }
    body.scroll-mode #display.scroll .track img { height:80vh; height:80dvh; width:auto; margin-bottom:0; margin-right:10vw; }
  }

  #displayBar {
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    width:100%; max-width:900px;
    opacity:0; pointer-events:none; transform:translateY(-4px); transition:opacity .2s, transform .2s;
  }
  #displayBar.show { opacity:1; pointer-events:auto; transform:translateY(0); }

  .controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; width:100%; max-width:900px; }
  button {
    padding:10px 18px; border:1px solid var(--btn-border); border-radius:999px;
    background:var(--btn-bg); color:var(--text); font-size:14px; cursor:pointer;
    touch-action:manipulation; user-select:none; transition:background .15s,border-color .15s,color .15s;
  }
  button:hover { border-color:var(--btn-hover-border); background:var(--btn-hover-bg); }
  button.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .colorRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; font-size:13px; color:var(--muted); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .swatch { width:26px; height:26px; padding:0; border-radius:50%; border:2px solid transparent; background:var(--c); cursor:pointer; touch-action:manipulation; }
  .swatch.active { border-color:#fff; box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--c); }
  input[type=color] { width:40px; height:32px; border:1px solid var(--btn-border); border-radius:8px; background:var(--btn-bg); padding:2px; }
  .sizeRow { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }

  #padFullscreen {
    position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
    background:var(--canvas-bg); z-index:9999; display:none; overflow:hidden;
    touch-action:none; overscroll-behavior:none;
  }
  #padFullscreen.open { display:flex; flex-direction:column; }

  #padCanvasWrap { flex:1 1 auto; min-height:0; position:relative; background:var(--canvas-bg); overflow:hidden; touch-action:none; }
  #padCanvas { position:absolute; top:0; left:0; display:block; touch-action:none; cursor:crosshair; background:transparent; }
  #padHint {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:var(--muted2); font-size:16px; pointer-events:none; white-space:nowrap; text-align:center;
  }
  #padFullscreen.hasInk #padHint { display:none; }

  #padSide { flex:0 0 auto; background:var(--panel2); border-top:1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); display:flex; flex-direction:column; }
  #padBottom { display:flex; flex-direction:column; flex:0 0 auto; }
  #padActions { display:flex; gap:8px; padding:10px 12px; justify-content:center; align-items:center; }
  #padActions button {
    flex:1; max-width:140px; padding:12px 0; font-size:15px;
    border-radius:999px; border:1px solid var(--btn-border); background:var(--btn-bg); color:var(--text); cursor:pointer;
  }
  #padActions button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  #padActions button.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }

  #padTools {
    display:none; padding:8px 10px;
    border-top:1px solid var(--border);
    max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #padTools.open { display:block; }

  .group { border:1px solid var(--btn-border); border-radius:12px; margin:8px 0; background:var(--btn-bg); overflow:hidden; }
  .group > .groupHead { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text); user-select:none; }
  .group > .groupHead .arrow { transition:transform .2s; font-size:12px; color:var(--muted2); }
  .group.open > .groupHead .arrow { transform:rotate(90deg); }
  .group > .groupBody { display:none; padding:8px 12px 12px; border-top:1px solid var(--border); }
  .group.open > .groupBody { display:block; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap; }
  .row .label { font-size:12px; color:var(--muted2); min-width:40px; }
  .row button { padding:8px 14px; font-size:13px; border-radius:999px; }
  .row button.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .row button.danger.active { background:#ff6b6b; color:#0f0f14; border-color:#ff6b6b; }
  .sliderRow { display:flex; align-items:center; gap:8px; width:100%; }
  .sliderRow input[type=range] { flex:1; accent-color:var(--accent); }
  .sliderRow .val { min-width:44px; text-align:right; font-size:12px; color:var(--muted2); }

  #padMobile { display:flex; flex-direction:column; flex:1; min-height:0; width:100%; }
  #padDesktop { display:none; }

  /* ===== 电脑端布局：左画布自适应 + 右侧固定工具栏 ===== */
  @media (min-width:760px) and (orientation:landscape) {
    #padMobile { display:none; }
    #padDesktop {
      display:flex;
      flex-direction:row;
      flex:1 1 auto;
      min-height:0;
      min-width:0;
      width:100%;
      height:100%;
    }
    #padDesktop #padCanvasWrapDesktop {
      flex:1 1 auto;
      min-width:0;
      min-height:0;
      position:relative;
      background:var(--canvas-bg);
      overflow:hidden;
      touch-action:none;
      order:1;
    }
    #padDesktop #padCanvasDesktop {
      position:absolute;
      top:0; left:0;
      display:block;
      touch-action:none;
      cursor:crosshair;
      background:transparent;
    }
    #padDesktop #padSideDesktop {
      order:2;
      width:300px;
      flex:0 0 300px;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--panel2);
      border-left:1px solid var(--border);
      min-height:0;
    }
    #padDesktop #padToolsDesktop {
      display:block !important;
      flex:1 1 auto;
      min-height:0;
      max-height:none;
      overflow-y:auto;
      border-top:none;
      -webkit-overflow-scrolling:touch;
    }
    #padDesktop #padActionsDesktop {
      flex:0 0 auto;
      flex-direction:column;
      padding:12px;
      border-top:1px solid var(--border);
    }
    #padDesktop #padActionsDesktop button {
      width:100%;
      max-width:none;
    }
    /* 电脑端不需要"工具"开关按钮 */
    #padDesktop [data-tool-toggle] { display:none; }
  }

  #fullscreenLayer { position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:1000; display:none; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
  body.theme-light #fullscreenLayer { background:rgba(243,243,247,.98); }
  #fullscreenLayer.open { display:flex; }
  #fsStage { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:grab; }
  #fsStage.dragging { cursor:grabbing; }
  #fsStaticWrap { display:none; width:100%; height:100%; align-items:center; justify-content:center; }
  #fullscreenLayer.static #fsStaticWrap { display:flex; }
  #fsImg { max-width:90%; max-height:90%; transform-origin:center center; transition:transform .12s ease-out; user-select:none; -webkit-user-drag:none; will-change:transform; object-fit:contain; }

  #fsScrollWrap { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; }
  #fullscreenLayer.scroll #fsScrollWrap { display:flex; }
  .fsTrack { display:flex; flex-direction:column; align-items:center; width:100%; height:auto; animation: fsMarqueeY var(--fsSpeed,8s) linear infinite; will-change:transform; transform: translateY(-50%); }
  .fsTrack img { width:70vw; max-width:1200px; height:auto; margin-bottom:8vh; flex:0 0 auto; object-fit:contain; }
  @keyframes fsMarqueeY { from{transform:translateY(-50%)} to{transform:translateY(0)} }

  @media (min-width:760px) and (orientation:landscape) {
    #fsScrollWrap { flex-direction:row; align-items:center; justify-content:flex-start; }
    .fsTrack { flex-direction:row; align-items:center; width:auto; height:100%; animation: fsMarqueeX var(--fsSpeed,8s) linear infinite; transform: translateX(0); }
    .fsTrack img { height:40vh; width:auto; margin-bottom:0; margin-right:10vw; }
    @keyframes fsMarqueeX { from{transform:translateX(0)} to{transform:translateX(-100%)} }
  }

  #fsBar { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; padding:10px 16px; background:rgba(30,30,40,.85); border:1px solid #333; border-radius:999px; z-index:1001; backdrop-filter:blur(10px); max-width:calc(100vw - 32px); flex-wrap:wrap; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
  body.theme-light #fsBar { background:rgba(255,255,255,.92); border-color:#d0d0da; }
  #fsBar.show { opacity:1; pointer-events:auto; }
  #fsBar button { padding:8px 16px; font-size:14px; border-radius:999px; border:1px solid var(--btn-border); background:var(--btn-bg); color:var(--text); cursor:pointer; }
  #fsBar button.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  #fsZoomVal { font-size:13px; color:var(--muted2); min-width:48px; text-align:center; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <h1>写一句话，然后选择展示方式</h1>

  <div class="controls">
    <button id="btnPadFullscreen">全屏手写</button>
    <button id="btnTheme" title="切换深色/浅色背景">🌙 深色</button>
    <div class="colorRow">
      <span>笔迹颜色</span>
      <div class="swatches" id="swatches">
        <button class="swatch active" data-color="#e8e8f0" style="--c:#e8e8f0"></button>
        <button class="swatch" data-color="#6ee7ff" style="--c:#6ee7ff"></button>
        <button class="swatch" data-color="#a78bfa" style="--c:#a78bfa"></button>
        <button class="swatch" data-color="#f472b6" style="--c:#f472b6"></button>
        <button class="swatch" data-color="#feca57" style="--c:#feca57"></button>
        <button class="swatch" data-color="#51cf66" style="--c:#51cf66"></button>
        <button class="swatch" data-color="#ff6b6b" style="--c:#ff6b6b"></button>
      </div>
      <input type="color" id="inkColor" value="#e8e8f0">
    </div>
  </div>

  <div id="display"><span id="emptyTip">生成的笔迹会显示在这里</span></div>

  <div id="displayBar">
    <button id="btnStatic" class="active" disabled>静态</button>
    <button id="btnScroll" disabled>滚动</button>
    <button id="btnFullscreen" disabled>全屏预览</button>
    <button id="btnCopy" disabled>复制图片</button>
    <button id="btnDelete" disabled>删除</button>
    <div class="sizeRow" id="speedRow" style="display:none;">
      <span>速度</span>
      <input type="range" id="speed" min="2" max="20" value="8" step="1">
      <span id="speedVal">8s</span>
    </div>
  </div>

  <div id="fullscreenLayer">
    <div id="fsStage">
      <div id="fsStaticWrap"><img id="fsImg" alt="手写笔迹"></div>
      <div id="fsScrollWrap">
        <div class="fsTrack">
          <img class="fsScrollImg" alt="">
          <img class="fsScrollImg" alt="">
        </div>
      </div>
    </div>
    <div id="fsBar">
      <button id="fsModeStatic" class="active">静态</button>
      <button id="fsModeScroll">滚动</button>
      <button id="fsZoomOut">－</button>
      <span id="fsZoomVal">100%</span>
      <button id="fsZoomIn">＋</button>
      <button id="fsReset">重置</button>
      <button id="fsClose">关闭</button>
    </div>
  </div>

  <div id="padFullscreen">
    <div id="padMobile">
      <div id="padCanvasWrapMobile">
        <canvas id="padCanvasMobile"></canvas>
        <div class="pad-hint">单指写字 · 双指拖动画布</div>
      </div>
      <div id="padSideMobile">
        <div id="padBottomMobile">
          <div id="padToolsMobile" class="pad-tools"></div>
          <div id="padActionsMobile" class="pad-actions">
            <button data-tool-toggle="mobile">工具</button>
            <button class="primary" data-act="done-mobile">完成</button>
            <button data-act="cancel-mobile">取消</button>
          </div>
        </div>
      </div>
    </div>

    <div id="padDesktop">
      <div id="padCanvasWrapDesktop">
        <canvas id="padCanvasDesktop"></canvas>
        <div class="pad-hint">在这里手写（鼠标或手指）</div>
      </div>
      <div id="padSideDesktop">
        <div id="padToolsDesktop" class="pad-tools"></div>
        <div id="padActionsDesktop" class="pad-actions">
          <button class="primary" data-act="done-desktop">完成</button>
          <button data-act="cancel-desktop">取消</button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ================= 全局状态 =================
  const display = document.getElementById('display');
  const displayBar = document.getElementById('displayBar');
  const btnPadFullscreen = document.getElementById('btnPadFullscreen');
  const btnStatic = document.getElementById('btnStatic');
  const btnScroll = document.getElementById('btnScroll');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const btnCopy = document.getElementById('btnCopy');
  const btnDelete = document.getElementById('btnDelete');
  const btnTheme = document.getElementById('btnTheme');
  const speedRow = document.getElementById('speedRow');
  const speedInput = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const inkColorInput = document.getElementById('inkColor');
  const swatches = document.querySelectorAll('#swatches .swatch');

  let capturedBlob = null;
  let mode = 'static';
  let currentColor = '#e8e8f0';
  let currentSize = 3;
  let smoothLevel = 0;
  let theme = 'dark';
  let userPickedColor = false;

  // ================= 主题 =================
  function applyTheme(next) {
    theme = next;
    document.body.classList.toggle('theme-light', next === 'light');
    btnTheme.textContent = next === 'light' ? '☀️ 浅色' : '🌙 深色';
    if (!userPickedColor) setInkColor(next === 'light' ? '#111111' : '#e8e8f0', true);
    if (padFullscreen.classList.contains('open')) drawPad();
  }
  btnTheme.addEventListener('click', () => applyTheme(theme === 'light' ? 'dark' : 'light'));

  // ================= 预览按钮自动隐藏 =================
  let displayBarTimer = null;
  function showDisplayBar() {
    if (!displayBar) return;
    displayBar.classList.add('show');
    clearTimeout(displayBarTimer);
    displayBarTimer = setTimeout(() => displayBar.classList.remove('show'), 1000);
  }
  display.addEventListener('click', showDisplayBar);
  display.addEventListener('pointerdown', showDisplayBar);

  let fsBarTimer = null;
  function showFsBar() {
    const bar = document.getElementById('fsBar');
    if (!bar) return;
    bar.classList.add('show');
    clearTimeout(fsBarTimer);
    fsBarTimer = setTimeout(() => bar.classList.remove('show'), 1000);
  }

  // ================= 元素 =================
  const padFullscreen = document.getElementById('padFullscreen');

  const padCanvasWrapMobile = document.getElementById('padCanvasWrapMobile');
  const padCanvasMobile = document.getElementById('padCanvasMobile');
  const padToolsMobile = document.getElementById('padToolsMobile');
  const padActionsMobile = document.getElementById('padActionsMobile');

  const padCanvasWrapDesktop = document.getElementById('padCanvasWrapDesktop');
  const padCanvasDesktop = document.getElementById('padCanvasDesktop');
  const padToolsDesktop = document.getElementById('padToolsDesktop');
  const padActionsDesktop = document.getElementById('padActionsDesktop');

  let activeCanvas = null, activeCtx = null, activeWrap = null;

  // ================= 世界网格 =================
  const GRID_N = 96;
  const GRID_CELL_PX = 24;
  const WORLD_SIZE = GRID_N * GRID_CELL_PX;

  let padMode = 'smooth';
  let tool = 'draw';
  let zoom = 1;
  let viewX = 0, viewY = 0;
  let cssW = 1, cssH = 1;

  let strokes = [];
  let pixelMap = new Map();
  let pixelDirty = false;

  let drawing = false, curStroke = null, eraserOn = false;
  let panning = false, panLastX = 0, panLastY = 0;
  let pixelPainting = false;
  const padPointers = new Map();
  let pinchStartDist = 0, pinchStartMid = null, pinchStartView = null, pinchStartZoom = 1;

  function isDesktopLayout() {
    return window.matchMedia('(min-width:760px) and (orientation:landscape)').matches;
  }

  // ================= 通用绘制 =================
  function distToSegment(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }
  function hitStroke(s, p) {
    const r = (s.size || 3) / 2 + 8;
    const pts = s.points;
    if (pts.length === 1) return Math.hypot(p.x - pts[0].x, p.y - pts[0].y) <= r;
    for (let i = 0; i < pts.length - 1; i++) if (distToSegment(p, pts[i], pts[i + 1]) <= r) return true;
    return false;
  }
  function movingAverage(points, win) {
    if (points.length <= 2) return points.slice();
    const half = Math.floor(win / 2), out = [];
    for (let i = 0; i < points.length; i++) {
      let sx = 0, sy = 0, c = 0;
      for (let j = Math.max(0, i - half); j <= Math.min(points.length - 1, i + half); j++) {
        sx += points[j].x; sy += points[j].y; c++;
      }
      out.push({ x: sx / c, y: sy / c });
    }
    return out;
  }
  function smoothPoints(points, level) {
    let win = level === 2 ? 5 : level === 3 ? 7 : 3;
    let arr = movingAverage(points, win);
    if (level === 3) arr = movingAverage(arr, 5);
    return arr;
  }
  function drawSmoothCurve(context, pts) {
    if (pts.length < 2) return;
    context.beginPath();
    context.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      context.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    context.quadraticCurveTo(prev.x, prev.y, last.x, last.y);
    context.stroke();
  }
  function drawStroke(context, s) {
    if (!s.points.length) return;
    context.strokeStyle = s.color;
    context.fillStyle = s.color;
    context.lineWidth = s.size || 3;
    context.lineCap = 'round';
    context.lineJoin = 'round';
    let pts = s.points;
    if (s.smoothLevel > 0 && pts.length >= 3) {
      pts = smoothPoints(pts, s.smoothLevel);
      drawSmoothCurve(context, pts);
    } else {
      if (pts.length === 1) {
        context.beginPath();
        context.arc(pts[0].x, pts[0].y, (s.size || 3) / 2, 0, Math.PI * 2);
        context.fill();
      } else {
        context.beginPath();
        context.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) context.lineTo(pts[i].x, pts[i].y);
        context.stroke();
      }
    }
  }

  // ================= 视图变换 =================
  function worldToScreen(wx, wy) { return { x: (wx - viewX) * zoom, y: (wy - viewY) * zoom }; }
  function screenToWorld(sx, sy) { return { x: sx / zoom + viewX, y: sy / zoom + viewY }; }
  function clampView() {
    const vw = cssW / zoom, vh = cssH / zoom;
    if (vw >= WORLD_SIZE) viewX = (WORLD_SIZE - vw) / 2;
    else viewX = Math.max(0, Math.min(WORLD_SIZE - vw, viewX));
    if (vh >= WORLD_SIZE) viewY = (WORLD_SIZE - vh) / 2;
    else viewY = Math.max(0, Math.min(WORLD_SIZE - vh, viewY));
  }

  function applyPadSize() {
    const rect = activeWrap.getBoundingClientRect();
    let w = Math.floor(rect.width);
    let h = Math.floor(rect.height);
    if (w <= 1 || h <= 1) {
      w = Math.max(1, window.innerWidth);
      h = Math.max(1, window.innerHeight - 160);
    }
    cssW = w; cssH = h;
    const dpr = window.devicePixelRatio || 1;
    activeCanvas.style.width = cssW + 'px';
    activeCanvas.style.height = cssH + 'px';
    activeCanvas.width = Math.round(cssW * dpr);
    activeCanvas.height = Math.round(cssH * dpr);
    drawPad();
  }

  function initPadView() {
    zoom = Math.min(cssW / WORLD_SIZE, cssH / WORLD_SIZE) * 0.95;
    zoom = Math.max(0.2, Math.min(1, zoom));
    viewX = (WORLD_SIZE - cssW / zoom) / 2;
    viewY = (WORLD_SIZE - cssH / zoom) / 2;
    clampView();
    updateZoomUI();
    drawPad();
  }

  function drawPad() {
    if (!activeCtx) return;
    const ctx = activeCtx;
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = theme === 'light' ? '#ffffff' : '#0f0f14';
    ctx.fillRect(0, 0, cssW, cssH);

    const tl = worldToScreen(0, 0);
    const br = worldToScreen(WORLD_SIZE, WORLD_SIZE);
    ctx.save();
    ctx.strokeStyle = theme === 'light' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    ctx.restore();

    if (padMode === 'pixel') {
      drawGrid(ctx);
      drawPixels(ctx);
    }

    if (padMode === 'smooth') {
      ctx.save();
      ctx.translate(-viewX * zoom, -viewY * zoom);
      ctx.scale(zoom, zoom);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const s of strokes) drawStroke(ctx, s);
      ctx.restore();
    }

    padFullscreen.classList.toggle('hasInk', strokes.length > 0 || pixelMap.size > 0);
  }

  function drawGrid(ctx) {
    const cellScreen = GRID_CELL_PX * zoom;
    if (cellScreen < 3) return;
    const startGX = Math.max(0, Math.floor(viewX / GRID_CELL_PX));
    const endGX = Math.min(GRID_N, Math.ceil((viewX + cssW / zoom) / GRID_CELL_PX));
    const startGY = Math.max(0, Math.floor(viewY / GRID_CELL_PX));
    const endGY = Math.min(GRID_N, Math.ceil((viewY + cssH / zoom) / GRID_CELL_PX));
    ctx.save();
    ctx.strokeStyle = theme === 'light' ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    for (let gx = startGX; gx <= endGX; gx++) {
      const s = worldToScreen(gx * GRID_CELL_PX, 0);
      ctx.beginPath(); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, cssH); ctx.stroke();
    }
    for (let gy = startGY; gy <= endGY; gy++) {
      const s = worldToScreen(0, gy * GRID_CELL_PX);
      ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(cssW, s.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPixels(ctx) {
    if (pixelMap.size === 0) return;
    const cellScreen = GRID_CELL_PX * zoom;
    for (const [key, color] of pixelMap) {
      const [gx, gy] = key.split(',').map(Number);
      const s = worldToScreen(gx * GRID_CELL_PX, gy * GRID_CELL_PX);
      if (s.x + cellScreen < 0 || s.y + cellScreen < 0 || s.x > cssW || s.y > cssH) continue;
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(cellScreen), Math.ceil(cellScreen));
    }
  }

  // ================= 双向同步 =================
  function worldToGrid(wx, wy) { return { gx: Math.floor(wx / GRID_CELL_PX), gy: Math.floor(wy / GRID_CELL_PX) }; }
  function inGrid(gx, gy) { return gx >= 0 && gy >= 0 && gx < GRID_N && gy < GRID_N; }

  // strokes → pixelMap：按笔画经过的格子涂色
  function convertStrokesToPixels() {
    pixelMap.clear();
    if (strokes.length === 0) { pixelDirty = false; return; }

    function markCell(gx, gy, color) {
      if (gx < 0 || gy < 0 || gx >= GRID_N || gy >= GRID_N) return;
      pixelMap.set(gx + ',' + gy, color);
    }

    for (const s of strokes) {
      const color = s.color;
      const pts = s.points;
      if (!pts.length) continue;
      const r = (s.size || 3) / 2;

      // 覆盖一个点周围所有落在笔宽内的格子
      function coverAround(px, py) {
        const g0 = worldToGrid(px, py);
        markCell(g0.gx, g0.gy, color);
        if (r <= GRID_CELL_PX * 0.5) return;
        const extra = Math.ceil(r / GRID_CELL_PX);
        for (let dx = -extra; dx <= extra; dx++) {
          for (let dy = -extra; dy <= extra; dy++) {
            const nx = g0.gx + dx, ny = g0.gy + dy;
            const cx = (nx + 0.5) * GRID_CELL_PX;
            const cy = (ny + 0.5) * GRID_CELL_PX;
            if (Math.hypot(cx - px, cy - py) <= r + GRID_CELL_PX * 0.5) {
              markCell(nx, ny, color);
            }
          }
        }
      }

      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        coverAround(p.x, p.y);

        if (i > 0) {
          const a = pts[i - 1];
          const dx = p.x - a.x, dy = p.y - a.y;
          const dist = Math.hypot(dx, dy);
          const steps = Math.max(1, Math.ceil(dist / (GRID_CELL_PX * 0.5)));
          for (let k = 1; k < steps; k++) {
            const t = k / steps;
            coverAround(a.x + dx * t, a.y + dy * t);
          }
        }
      }
    }
    pixelDirty = false;
  }

  // pixelMap → strokes
  function rebuildStrokesFromPixels() {
    strokes = [];
    for (const [key, color] of pixelMap) {
      const [gx, gy] = key.split(',').map(Number);
      const x = gx * GRID_CELL_PX + GRID_CELL_PX / 2;
      const y = gy * GRID_CELL_PX + GRID_CELL_PX / 2;
      strokes.push({
        points: [{ x, y }],
        color,
        size: GRID_CELL_PX * 1.05,
        smoothLevel: 0
      });
    }
    pixelDirty = false;
  }

  function paintPixelAt(wx, wy, color) {
    const { gx, gy } = worldToGrid(wx, wy);
    if (!inGrid(gx, gy)) return;
    const key = gx + ',' + gy;
    if (color === null) {
      if (!pixelMap.has(key)) return;
      pixelMap.delete(key);
    } else {
      if (pixelMap.get(key) === color) return;
      pixelMap.set(key, color);
    }
    pixelDirty = true;
    drawPad();
  }

  function setPadMode(next) {
    if (next === padMode) return;
    if (next === 'pixel') {
      convertStrokesToPixels();
    } else {
      if (pixelDirty) rebuildStrokesFromPixels();
    }
    padMode = next;
    syncModeButtons();
    drawPad();
  }

  function setTool(next) {
    tool = next;
    syncToolButtons();
    if (activeCanvas) activeCanvas.style.cursor = next === 'pan' ? 'grab' : 'crosshair';
  }

  // ================= UI 同步 =================
  function syncModeButtons() {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === padMode));
  }
  function syncToolButtons() {
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  }
  function updateZoomUI() {
    document.querySelectorAll('[data-zoom-slider]').forEach(el => { el.value = Math.round(zoom * 100); });
    document.querySelectorAll('[data-zoom-val]').forEach(el => { el.textContent = Math.round(zoom * 100) + '%'; });
  }

  // ================= 指针事件 =================
  function getWorldPoint(e) {
    const rect = activeCanvas.getBoundingClientRect();
    return screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  }

  function onPadPointerDown(e) {
    e.preventDefault();
    padPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { activeCanvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (padPointers.size === 1) {
      if (tool === 'pan' || (e.pointerType === 'mouse' && e.button === 1)) {
        panning = true; panLastX = e.clientX; panLastY = e.clientY;
        activeCanvas.style.cursor = 'grabbing';
        return;
      }
      if (padMode === 'pixel') {
        pixelPainting = true;
        const w = getWorldPoint(e);
        paintPixelAt(w.x, w.y, eraserOn ? null : currentColor);
        return;
      }
      drawing = true;
      const w = getWorldPoint(e);
      curStroke = { points: [w], color: currentColor, size: currentSize, smoothLevel: smoothLevel };
      strokes.push(curStroke);
      drawPad();
    } else if (padPointers.size === 2) {
      if (curStroke) { strokes.pop(); curStroke = null; drawing = false; }
      pixelPainting = false;
      const pts = [...padPointers.values()];
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      pinchStartView = { x: viewX, y: viewY };
      pinchStartZoom = zoom;
      drawPad();
    }
  }

  function onPadPointerMove(e) {
    if (!padPointers.has(e.pointerId)) return;
    padPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (padPointers.size >= 2) {
      e.preventDefault();
      const pts = [...padPointers.values()];
      const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchStartDist > 0) {
        const scale = dist / pinchStartDist;
        const newZoom = Math.max(0.2, Math.min(8, pinchStartZoom * scale));
        const rect = activeCanvas.getBoundingClientRect();
        const startMidLocal = { x: pinchStartMid.x - rect.left, y: pinchStartMid.y - rect.top };
        const startWorld = {
          x: startMidLocal.x / pinchStartZoom + pinchStartView.x,
          y: startMidLocal.y / pinchStartZoom + pinchStartView.y
        };
        const curMidLocal = { x: mid.x - rect.left, y: mid.y - rect.top };
        viewX = startWorld.x - curMidLocal.x / newZoom;
        viewY = startWorld.y - curMidLocal.y / newZoom;
        zoom = newZoom;
        clampView();
        updateZoomUI();
        drawPad();
      }
      return;
    }

    if (panning) {
      const dx = e.clientX - panLastX, dy = e.clientY - panLastY;
      panLastX = e.clientX; panLastY = e.clientY;
      viewX -= dx / zoom; viewY -= dy / zoom;
      clampView();
      drawPad();
      return;
    }

    if (pixelPainting) {
      const w = getWorldPoint(e);
      paintPixelAt(w.x, w.y, eraserOn ? null : currentColor);
      return;
    }

    if (!drawing || !curStroke) return;
    e.preventDefault();
    const w = getWorldPoint(e);
    const pts = curStroke.points, prev = pts[pts.length - 1];
    if (Math.hypot(w.x - prev.x, w.y - prev.y) < 1.5 / zoom) return;
    pts.push(w);
    drawPad();
  }

  function onPadPointerUp(e) {
    padPointers.delete(e.pointerId);
    if (padPointers.size < 2) { pinchStartDist = 0; pinchStartMid = null; pinchStartView = null; }
    if (padPointers.size === 0) {
      drawing = false; pixelPainting = false; panning = false;
      if (activeCanvas) activeCanvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
      if (curStroke) { curStroke = null; }
    }
  }

  function bindCanvas(canvas) {
    canvas.addEventListener('pointerdown', onPadPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPadPointerMove, { passive: false });
    canvas.addEventListener('pointerup', onPadPointerUp);
    canvas.addEventListener('pointercancel', onPadPointerUp);
    canvas.addEventListener('pointerleave', onPadPointerUp);
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const local = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const before = screenToWorld(local.x, local.y);
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      zoom = Math.max(0.2, Math.min(8, zoom * factor));
      viewX = before.x - local.x / zoom;
      viewY = before.y - local.y / zoom;
      clampView();
      updateZoomUI();
      drawPad();
    }, { passive: false });
  }
  bindCanvas(padCanvasMobile);
  bindCanvas(padCanvasDesktop);

  // ================= 工具面板 =================
  function buildToolsHTML() {
    return `
      <div class="group open">
        <div class="groupHead">绘画模式 <span class="arrow">▶</span></div>
        <div class="groupBody">
          <div class="row">
            <button data-mode="smooth">平滑手写</button>
            <button data-mode="pixel">像素模式</button>
          </div>
        </div>
      </div>
      <div class="group open">
        <div class="groupHead">画布操作 <span class="arrow">▶</span></div>
        <div class="groupBody">
          <div class="row">
            <button data-tool="pan">平移模式</button>
            <button data-tool="draw">绘画模式</button>
          </div>
          <div class="row">
            <span class="label">缩放</span>
            <div class="sliderRow">
              <input type="range" data-zoom-slider min="20" max="800" value="100" step="10">
              <span class="val" data-zoom-val>100%</span>
            </div>
          </div>
          <div class="row">
            <button data-act="zoom-reset">重置视图</button>
          </div>
        </div>
      </div>
      <div class="group open">
        <div class="groupHead">画笔设置 <span class="arrow">▶</span></div>
        <div class="groupBody">
          <div class="row">
            <span class="label">颜色</span>
            <div class="swatches">
              <button class="swatch active" data-color="#e8e8f0" style="--c:#e8e8f0"></button>
              <button class="swatch" data-color="#6ee7ff" style="--c:#6ee7ff"></button>
              <button class="swatch" data-color="#a78bfa" style="--c:#a78bfa"></button>
              <button class="swatch" data-color="#f472b6" style="--c:#f472b6"></button>
              <button class="swatch" data-color="#feca57" style="--c:#feca57"></button>
              <button class="swatch" data-color="#51cf66" style="--c:#51cf66"></button>
              <button class="swatch" data-color="#ff6b6b" style="--c:#ff6b6b"></button>
            </div>
            <input type="color" data-color-picker value="#e8e8f0" style="width:36px;height:30px;border:1px solid #333;border-radius:8px;background:#1a1a22;padding:2px;flex-shrink:0;">
          </div>
          <div class="row">
            <span class="label">粗细</span>
            <input type="range" data-size-slider min="1" max="20" value="3" step="1" style="flex:1;min-width:80px;accent-color:var(--accent);">
            <span data-size-val style="font-size:13px;color:var(--muted2);min-width:22px;text-align:center;">3</span>
          </div>
          <div class="row">
            <span class="label">平滑</span>
            <div data-smooth-group style="display:flex;gap:6px;">
              <button data-smooth="0" class="active">关</button>
              <button data-smooth="1">弱</button>
              <button data-smooth="2">中</button>
              <button data-smooth="3">强</button>
            </div>
          </div>
        </div>
      </div>
      <div class="group open">
        <div class="groupHead">编辑 <span class="arrow">▶</span></div>
        <div class="groupBody">
          <div class="row">
            <button data-act="undo">撤销</button>
            <button data-act="eraser">橡皮</button>
            <button data-act="clear">清空</button>
          </div>
        </div>
      </div>
    `;
  }

  function mountTools() {
    [padToolsMobile, padToolsDesktop].forEach(container => {
      container.innerHTML = buildToolsHTML();
      container.querySelectorAll('.group > .groupHead').forEach(head => {
        head.addEventListener('click', () => head.parentElement.classList.toggle('open'));
      });
      container.querySelectorAll('[data-mode]').forEach(b => {
        b.addEventListener('click', () => setPadMode(b.dataset.mode));
      });
      container.querySelectorAll('[data-tool]').forEach(b => {
        b.addEventListener('click', () => setTool(b.dataset.tool));
      });
      container.querySelectorAll('[data-zoom-slider]').forEach(sl => {
        sl.addEventListener('input', () => {
          const centerWorld = screenToWorld(cssW / 2, cssH / 2);
          zoom = Math.max(0.2, Math.min(8, parseInt(sl.value, 10) / 100));
          viewX = centerWorld.x - (cssW / 2) / zoom;
          viewY = centerWorld.y - (cssH / 2) / zoom;
          clampView();
          updateZoomUI();
          drawPad();
        });
      });
      container.querySelectorAll('[data-act="zoom-reset"]').forEach(b => {
        b.addEventListener('click', () => initPadView());
      });
      container.querySelectorAll('.swatch').forEach(s => {
        s.addEventListener('click', () => setInkColor(s.dataset.color));
      });
      container.querySelectorAll('[data-color-picker]').forEach(inp => {
        inp.addEventListener('input', () => setInkColor(inp.value));
      });
      container.querySelectorAll('[data-size-slider]').forEach(sl => {
        sl.addEventListener('input', () => setSize(parseInt(sl.value, 10)));
      });
      container.querySelectorAll('[data-smooth-group] button').forEach(b => {
        b.addEventListener('click', () => {
          smoothLevel = parseInt(b.dataset.smooth, 10);
          container.querySelectorAll('[data-smooth-group] button').forEach(x => x.classList.toggle('active', x === b));
          drawPad();
        });
      });
      container.querySelectorAll('[data-act="undo"]').forEach(b => {
        b.addEventListener('click', () => {
          if (padMode === 'smooth') {
            if (strokes.length) { strokes.pop(); drawPad(); }
          } else {
            const keys = [...pixelMap.keys()];
            if (keys.length) { pixelMap.delete(keys[keys.length - 1]); pixelDirty = true; drawPad(); }
          }
        });
      });
      container.querySelectorAll('[data-act="eraser"]').forEach(b => {
        b.addEventListener('click', () => {
          eraserOn = !eraserOn;
          container.querySelectorAll('[data-act="eraser"]').forEach(x => {
            x.classList.toggle('active', eraserOn);
            x.classList.toggle('danger', eraserOn);
          });
          if (activeCanvas) activeCanvas.style.cursor = eraserOn ? 'cell' : (tool === 'pan' ? 'grab' : 'crosshair');
        });
      });
      container.querySelectorAll('[data-act="clear"]').forEach(b => {
        b.addEventListener('click', () => {
          strokes = []; pixelMap.clear(); pixelDirty = false;
          curStroke = null; drawing = false;
          drawPad();
        });
      });
    });
    syncModeButtons(); syncToolButtons(); updateZoomUI();
    refreshSwatchActive(); refreshSizeUI(); refreshSmoothUI();
  }

  function refreshSwatchActive() {
    document.querySelectorAll('.swatch[data-color]').forEach(s => {
      s.classList.toggle('active', (s.dataset.color || '').toLowerCase() === currentColor.toLowerCase());
    });
    document.querySelectorAll('[data-color-picker]').forEach(inp => { inp.value = currentColor; });
  }
  function refreshSizeUI() {
    document.querySelectorAll('[data-size-slider]').forEach(sl => { sl.value = currentSize; });
    document.querySelectorAll('[data-size-val]').forEach(v => { v.textContent = currentSize; });
  }
  function refreshSmoothUI() {
    document.querySelectorAll('[data-smooth-group]').forEach(g => {
      g.querySelectorAll('button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.smooth, 10) === smoothLevel));
    });
  }

  mountTools();

  document.querySelectorAll('[data-tool-toggle]').forEach(b => {
    b.addEventListener('click', () => {
      padToolsMobile.classList.toggle('open');
      b.classList.toggle('active', padToolsMobile.classList.contains('open'));
    });
  });

  // ================= 打开/关闭 =================
  function openPad() {
    padFullscreen.classList.add('open');
    padToolsMobile.classList.remove('open');
    document.querySelectorAll('[data-tool-toggle]').forEach(b => b.classList.remove('active'));

    const desktop = isDesktopLayout();
    activeCanvas = desktop ? padCanvasDesktop : padCanvasMobile;
    activeWrap = desktop ? padCanvasWrapDesktop : padCanvasWrapMobile;
    activeCtx = activeCanvas.getContext('2d');

    let tries = 0;
    function tryInit() {
      tries++;
      applyPadSize();
      const rect = activeWrap.getBoundingClientRect();
      if ((rect.width <= 1 || rect.height <= 1) && tries < 20) { requestAnimationFrame(tryInit); return; }
      drawing = false; curStroke = null; eraserOn = false; pixelPainting = false; panning = false;
      padPointers.clear();
      setTool('draw');
      syncModeButtons(); syncToolButtons();
      refreshSwatchActive(); refreshSizeUI(); refreshSmoothUI();
      initPadView();
    }
    requestAnimationFrame(() => requestAnimationFrame(tryInit));
    setTimeout(() => { if (padFullscreen.classList.contains('open')) applyPadSize(); }, 200);
  }

  function closePad() {
    padFullscreen.classList.remove('open');
    padToolsMobile.classList.remove('open');
    drawing = false; curStroke = null; pixelPainting = false; panning = false;
    padPointers.clear();
    [padCanvasMobile, padCanvasDesktop].forEach(c => {
      const cx = c.getContext('2d');
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.clearRect(0, 0, c.width, c.height);
    });
  }

  btnPadFullscreen.addEventListener('click', openPad);

  document.querySelectorAll('[data-act="done-mobile"], [data-act="done-desktop"]').forEach(b => {
    b.addEventListener('click', finishPad);
  });
  document.querySelectorAll('[data-act="cancel-mobile"], [data-act="cancel-desktop"]').forEach(b => {
    b.addEventListener('click', closePad);
  });

  // ================= 完成导出 =================
  function finishPad() {
    if (padMode === 'pixel' && pixelDirty) {
      rebuildStrokesFromPixels();
    }
    if (strokes.length === 0) { resetDisplay(); closePad(); return; }

    const b = getBounds(strokes);
    const pad = 30;
    const srcW = b.w + pad * 2, srcH = b.h + pad * 2;
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(srcW * 2));
    tmp.height = Math.max(1, Math.round(srcH * 2));
    const tctx = tmp.getContext('2d');
    tctx.scale(2, 2);
    tctx.fillStyle = theme === 'light' ? '#ffffff' : '#0f0f14';
    tctx.fillRect(0, 0, srcW, srcH);
    tctx.lineCap = 'round'; tctx.lineJoin = 'round';
    tctx.translate(-b.minX + pad, -b.minY + pad);
    for (const s of strokes) drawStroke(tctx, s);

    tmp.toBlob(blob => {
      capturedBlob = blob;
      renderPreview();
      [btnStatic, btnScroll, btnCopy, btnDelete, btnFullscreen].forEach(x => x.disabled = false);
      showDisplayBar();
      closePad();
    }, 'image/png');
  }

  function getBounds(arr) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of arr) for (const p of s.points) {
      if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
    }
    return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
  }

  // ================= 预览区 =================
  function resetDisplay() {
    capturedBlob = null;
    display.innerHTML = '<span id="emptyTip">生成的笔迹会显示在这里</span>';
    display.className = '';
    [btnStatic, btnScroll, btnCopy, btnDelete, btnFullscreen].forEach(x => x.disabled = true);
    btnStatic.classList.add('active'); btnScroll.classList.remove('active');
    speedRow.style.display = 'none';
    displayBar.classList.remove('show');
    document.body.classList.remove('scroll-mode');
  }
  function renderPreview() {
    display.innerHTML = '';
    display.classList.remove('static', 'scroll');
    display.classList.add(mode);
    if (!capturedBlob) return;
    const url = URL.createObjectURL(capturedBlob);
    if (mode === 'static') {
      const img = new Image();
      img.src = url;
      img.onload = () => URL.revokeObjectURL(url);
      display.appendChild(img);
    } else {
      const track = document.createElement('div');
      track.className = 'track';
      track.style.setProperty('--speed', speedInput.value + 's');
      for (let i = 0; i < 2; i++) { const img = new Image(); img.src = url; track.appendChild(img); }
      display.appendChild(track);
    }
    display.classList.add('hasContent');
  }
  function setDisplayMode(next) {
    mode = next;
    btnStatic.classList.toggle('active', next === 'static');
    btnScroll.classList.toggle('active', next === 'scroll');
    speedRow.style.display = next === 'scroll' ? 'flex' : 'none';
    document.body.classList.toggle('scroll-mode', next === 'scroll');
    renderPreview();
    showDisplayBar();
    if (fullscreenLayer.classList.contains('open')) setFullscreenMode(next);
  }
  btnStatic.addEventListener('click', () => setDisplayMode('static'));
  btnScroll.addEventListener('click', () => setDisplayMode('scroll'));

  speedInput.addEventListener('input', () => {
    speedVal.textContent = speedInput.value + 's';
    const t = display.querySelector('.track');
    if (t) t.style.setProperty('--speed', speedInput.value + 's');
    const fT = document.querySelector('.fsTrack');
    if (fT) fT.style.setProperty('--fsSpeed', speedInput.value + 's');
  });

  btnCopy.addEventListener('click', async () => {
    if (!capturedBlob) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': capturedBlob })]);
      btnCopy.textContent = '已复制';
      setTimeout(() => btnCopy.textContent = '复制图片', 1200);
    } catch (e) {
      btnCopy.textContent = '复制失败';
      setTimeout(() => btnCopy.textContent = '复制图片', 1200);
    }
  });
  btnDelete.addEventListener('click', resetDisplay);

  // ================= 全屏预览 =================
  const fullscreenLayer = document.getElementById('fullscreenLayer');
  const fsStage = document.getElementById('fsStage');
  const fsImg = document.getElementById('fsImg');
  const fsScrollImgs = document.querySelectorAll('.fsScrollImg');
  const fsTrack = document.querySelector('.fsTrack');
  const fsZoomVal = document.getElementById('fsZoomVal');
  const fsZoomIn = document.getElementById('fsZoomIn');
  const fsZoomOut = document.getElementById('fsZoomOut');
  const fsReset = document.getElementById('fsReset');
  const fsClose = document.getElementById('fsClose');
  const fsModeStatic = document.getElementById('fsModeStatic');
  const fsModeScroll = document.getElementById('fsModeScroll');

  let fsScale = 1;
  const fsMin = 0.5, fsMax = 8;
  let fsOffsetX = 0, fsOffsetY = 0;
  let fsDragging = false, fsLastX = 0, fsLastY = 0;
  let pinchStartDistFs = 0, pinchStartScale = 1;
  const fsPointers = new Map();

  function fsApply() {
    fsImg.style.transform = `translate(${fsOffsetX}px, ${fsOffsetY}px) scale(${fsScale})`;
    fsZoomVal.textContent = Math.round(fsScale * 100) + '%';
  }
  function fsResetView() { fsScale = 1; fsOffsetX = 0; fsOffsetY = 0; fsApply(); }
  function fsSetScale(next) { fsScale = Math.min(fsMax, Math.max(fsMin, next)); fsApply(); }

  function setFullscreenMode(next) {
    fullscreenLayer.classList.remove('static', 'scroll');
    fullscreenLayer.classList.add(next);
    fsModeStatic.classList.toggle('active', next === 'static');
    fsModeScroll.classList.toggle('active', next === 'scroll');
    fsResetView();
  }
  function openFullscreen() {
    if (!capturedBlob) return;
    const url = URL.createObjectURL(capturedBlob);
    fsImg.onload = () => URL.revokeObjectURL(url);
    fsImg.src = url;
    fsScrollImgs.forEach(img => { img.src = url; });
    fsTrack.style.setProperty('--fsSpeed', speedInput.value + 's');
    setFullscreenMode(mode);
    fullscreenLayer.classList.add('open');
    showFsBar();
  }
  function closeFullscreen() {
    fullscreenLayer.classList.remove('open');
    fsImg.src = '';
    fsScrollImgs.forEach(img => { img.src = ''; });
    fsPointers.clear(); pinchStartDistFs = 0;
    document.getElementById('fsBar').classList.remove('show');
  }

  btnFullscreen.addEventListener('click', openFullscreen);
  fsClose.addEventListener('click', closeFullscreen);
  fsModeStatic.addEventListener('click', () => setFullscreenMode('static'));
  fsModeScroll.addEventListener('click', () => setFullscreenMode('scroll'));
  fsZoomIn.addEventListener('click', () => fsSetScale(fsScale * 1.25));
  fsZoomOut.addEventListener('click', () => fsSetScale(fsScale / 1.25));
  fsReset.addEventListener('click', fsResetView);

  fsStage.addEventListener('wheel', e => {
    if (!fullscreenLayer.classList.contains('static')) return;
    e.preventDefault();
    fsSetScale(fsScale * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });

  fsStage.addEventListener('pointerdown', e => {
    if (!fullscreenLayer.classList.contains('static')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fsStage.setPointerCapture(e.pointerId);
    if (e.pointerType === 'touch') fsPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    fsDragging = true; fsLastX = e.clientX; fsLastY = e.clientY;
    fsStage.classList.add('dragging');
  });
  fsStage.addEventListener('pointermove', e => {
    if (!fsDragging) return;
    if (e.pointerType === 'touch' && fsPointers.has(e.pointerId)) {
      fsPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const pts = [...fsPointers.values()];
      if (pts.length === 2) {
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinchStartDistFs === 0) { pinchStartDistFs = dist; pinchStartScale = fsScale; }
        else { fsSetScale(pinchStartScale * (dist / pinchStartDistFs)); return; }
      }
    }
    fsOffsetX += e.clientX - fsLastX; fsOffsetY += e.clientY - fsLastY;
    fsLastX = e.clientX; fsLastY = e.clientY;
    fsApply();
  });
  function fsPointerUp(e) {
    fsDragging = false; fsStage.classList.remove('dragging');
    if (e.pointerType === 'touch') {
      fsPointers.delete(e.pointerId);
      if (fsPointers.size < 2) pinchStartDistFs = 0;
    }
  }
  fsStage.addEventListener('pointerup', fsPointerUp);
  fsStage.addEventListener('pointercancel', fsPointerUp);
  fsStage.addEventListener('dblclick', () => { if (fullscreenLayer.classList.contains('static')) fsResetView(); });
  fsStage.addEventListener('click', showFsBar);
  fsStage.addEventListener('pointerdown', showFsBar);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (padFullscreen.classList.contains('open')) closePad();
      else if (fullscreenLayer.classList.contains('open')) closeFullscreen();
    }
  });

  window.addEventListener('resize', () => {
    if (padFullscreen.classList.contains('open')) {
      const desktop = isDesktopLayout();
      const nextCanvas = desktop ? padCanvasDesktop : padCanvasMobile;
      if (nextCanvas !== activeCanvas) {
        activeCanvas = nextCanvas;
        activeWrap = desktop ? padCanvasWrapDesktop : padCanvasWrapMobile;
        activeCtx = activeCanvas.getContext('2d');
        applyPadSize();
        initPadView();
      } else {
        applyPadSize();
      }
    }
    if (document.body.classList.contains('scroll-mode')) {
      display.style.height = '100dvh';
      requestAnimationFrame(() => { display.style.height = ''; });
    }
  });

  // ================= 颜色/粗细 =================
  function setInkColor(color, fromTheme) {
    currentColor = color;
    if (!fromTheme) userPickedColor = true;
    inkColorInput.value = color;
    swatches.forEach(s => s.classList.toggle('active', (s.dataset.color || '').toLowerCase() === color.toLowerCase()));
    refreshSwatchActive();
  }
  function setSize(size) {
    currentSize = Math.max(1, Math.min(20, size));
    refreshSizeUI();
  }
  swatches.forEach(s => s.addEventListener('click', () => setInkColor(s.dataset.color)));
  inkColorInput.addEventListener('input', () => setInkColor(inkColorInput.value));

  // ================= 初始 =================
  applyTheme('dark');
  setSize(3);
  setPadMode('smooth');
  setTool('draw');
  refreshSmoothUI();
</script>
</body>
